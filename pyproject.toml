[project]
name = "torrentpal"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "libtorrent>=2.0.13",
    "pyside6>=6.11.1",
]

[project.scripts]
torrentpal = "torrentpal.app:main"

[build-system]
requires = ["uv-build>=0.11.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
